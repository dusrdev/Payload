name: publish-nuget

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate secrets
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          SNK: ${{ secrets.SNK }}
        run: |
          missing=()

          for name in NUGET_API_KEY SNK; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore src/Payload/Payload.csproj

      - name: Materialize strong-name key
        shell: bash
        env:
          SNK: ${{ secrets.SNK }}
        run: |
          key_path="$RUNNER_TEMP/Payload.snk"
          printf '%s' "$SNK" | base64 --decode > "$key_path"
          echo "STRONG_NAME_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Pack
        shell: bash
        run: |
          dotnet pack src/Payload/Payload.csproj \
            -c Release \
            -nologo \
            --no-restore \
            -p:GeneratePackageOnBuild=false \
            -p:ContinuousIntegrationBuild=true \
            -p:SignAssembly=true \
            -p:AssemblyOriginatorKeyFile="$STRONG_NAME_KEY_PATH" \
            -o artifacts/nuget

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: artifacts/nuget/*
          if-no-files-found: error

      - name: Push packages to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          shopt -s nullglob

          for package in artifacts/nuget/*.nupkg; do
            if [[ "$package" == *.snupkg ]]; then
              continue
            fi

            dotnet nuget push "$package" \
              --source "$NUGET_SOURCE" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

          for symbols in artifacts/nuget/*.snupkg; do
            dotnet nuget push "$symbols" \
              --source "$NUGET_SOURCE" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
