name: publish-nuget

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    env:
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true

      - name: Validate secrets
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_SIGN_CERT_BASE64: ${{ secrets.NUGET_SIGN_CERT_BASE64 }}
          NUGET_SIGN_CERT_PASSWORD: ${{ secrets.NUGET_SIGN_CERT_PASSWORD }}
          NUGET_TIMESTAMP_URL: ${{ secrets.NUGET_TIMESTAMP_URL }}
        run: |
          $required = @(
            'NUGET_API_KEY',
            'NUGET_SIGN_CERT_BASE64',
            'NUGET_SIGN_CERT_PASSWORD',
            'NUGET_TIMESTAMP_URL'
          )

          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace((Get-Item "env:$_").Value) }

          if ($missing.Count -gt 0) {
            throw "Missing required secrets: $($missing -join ', ')"
          }

      - name: Restore
        run: dotnet restore src/Payload/Payload.csproj

      - name: Pack
        run: dotnet pack src/Payload/Payload.csproj -c Release -nologo --no-restore -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true -o artifacts/nuget

      - name: Materialize signing certificate
        shell: pwsh
        env:
          NUGET_SIGN_CERT_BASE64: ${{ secrets.NUGET_SIGN_CERT_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'nuget-signing-cert.pfx'
          [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:NUGET_SIGN_CERT_BASE64))
          "SIGN_CERT_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign packages
        shell: pwsh
        env:
          NUGET_SIGN_CERT_PASSWORD: ${{ secrets.NUGET_SIGN_CERT_PASSWORD }}
          NUGET_TIMESTAMP_URL: ${{ secrets.NUGET_TIMESTAMP_URL }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/signed | Out-Null

          Get-ChildItem artifacts/nuget/*.nupkg |
            Where-Object { $_.Name -notlike '*.snupkg' } |
            ForEach-Object {
              dotnet nuget sign $_.FullName `
                --certificate-path $env:SIGN_CERT_PATH `
                --certificate-password $env:NUGET_SIGN_CERT_PASSWORD `
                --timestamper $env:NUGET_TIMESTAMP_URL `
                --output artifacts/signed `
                --overwrite
            }

          Get-ChildItem artifacts/nuget/*.snupkg -ErrorAction SilentlyContinue |
            Copy-Item -Destination artifacts/signed

      - name: Verify signed packages
        shell: pwsh
        run: |
          Get-ChildItem artifacts/signed/*.nupkg |
            Where-Object { $_.Name -notlike '*.snupkg' } |
            ForEach-Object {
              dotnet nuget verify $_.FullName --all
            }

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: artifacts/signed/*
          if-no-files-found: error

      - name: Push packages to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          Get-ChildItem artifacts/signed/*.nupkg |
            Where-Object { $_.Name -notlike '*.snupkg' } |
            ForEach-Object {
              dotnet nuget push $_.FullName `
                --source $env:NUGET_SOURCE `
                --api-key $env:NUGET_API_KEY `
                --skip-duplicate
            }

          Get-ChildItem artifacts/signed/*.snupkg -ErrorAction SilentlyContinue |
            ForEach-Object {
              dotnet nuget push $_.FullName `
                --source $env:NUGET_SOURCE `
                --api-key $env:NUGET_API_KEY `
                --skip-duplicate
            }
