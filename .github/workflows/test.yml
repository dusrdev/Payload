name: test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore Payload
        run: dotnet restore src/Payload/Payload.csproj

      - name: Restore Tests
        run: dotnet restore tests/Payload.Tests/Payload.Tests.csproj

      - name: Build Payload
        run: dotnet build src/Payload/Payload.csproj -c Release -nologo --no-restore

      - name: Run TUnit suite
        run: dotnet run --project tests/Payload.Tests/Payload.Tests.csproj -c Release --no-restore -- --disable-logo

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: payload-test-report
          path: TestResults/*.html
          if-no-files-found: warn
          retention-days: 400
